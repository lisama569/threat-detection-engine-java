# 优雅停机：滚动重启（SIGTERM）时先停止接客、完成在途请求，再触发状态快照落盘
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 重启续跑：本地状态快照文件（仅本地文件，无外部数据库/中间件）
detection.state.path=./data/engine-state.json
# 状态文件存在但损坏时：true=保守停服(FAILED, 写请求 503)；false=重置为全新实例(标记 corruptionReset)
detection.state.fail-on-corrupt=true
# 恢复期间写请求最长阻塞等待毫秒数，超时返回 503
detection.recovery.await-timeout-millis=10000
